database:
    type: sqlite
    sqlite:
        path: data/app.db
app:
    name: WytaoF Browser
    window:
        width: 1750
        height: 1000
        min_width: 1200
        min_height: 700
    max_profile_limit: 20
    used_cd_keys: []
runtime:
    max_memory_mb: 0
    gc_percent: 100
logging:
    level: info
    file_enabled: false
    file_path: data/logs/app.log
    format: text
    buffer_size: 4
    async_queue_size: 1000
    flush_interval_ms: 1000
    rotation:
        enabled: false
        max_size_mb: 100
        max_age: 7
        max_backups: 5
        time_interval: daily
    interceptor:
        enabled: true
        log_parameters: true
        log_results: true
        sensitive_fields:
            - password
            - token
            - secret
browser:
    user_data_root: data
    default_fingerprint_args:
        - --fingerprint-brand=Chrome
        - --fingerprint-platform=windows
    default_launch_args:
        - --disable-sync
        - --no-first-run
    default_start_urls: []
    restore_last_session: true
    start_ready_timeout_ms: 3000
    start_stable_window_ms: 1200
    cores:
        - core_id: core-Chrom-139
          core_name: Chrome Chrom-139
          core_path: chrome\Chrom-139
          is_default: true
        - core_id: core-Chrom-142
          core_name: Chrome Chrom-142
          core_path: chrome\Chrom-142
          is_default: false
        - core_id: core-Chrom-144
          core_name: Chrome Chrom-144
          core_path: chrome\Chrom-144
          is_default: false
proxy_check:
    bridge_start_timeout_ms: 15000
    speed_target_id: google_204
    ip_health_target_id: cf_trace
    targets:
        - id: google_204
          name: Google 204
          type: speed
          url: http://www.gstatic.com/generate_204
          timeout_ms: 10000
          expected_status:
            - 204
        - id: cf_trace
          name: Cloudflare Trace
          type: ip_health
          url: https://www.cloudflare.com/cdn-cgi/trace
          parser: cloudflare_trace
          timeout_ms: 20000
          expected_status:
            - 200
        - id: ippure_json
          name: IPPure JSON
          type: ip_health
          url: https://my.ippure.com/v1/info
          parser: json
          timeout_ms: 20000
          expected_status:
            - 200
launch_server:
    port: 19876
    auth:
        enabled: false
        api_key: ""
        header: X-Ant-Api-Key
automation:
    enabled: false
    install_policy: on_demand
    runtime_version: node-22.15.1-playwright-core-1.59.0
    keep_runtime_on_disable: true
    node_source: auto
    node_version: 22.15.1
    playwright_core_version: 1.59.0
